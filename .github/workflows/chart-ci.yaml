name: chart-ci
on: { pull_request: { paths: ["charts/canvas-lms/**"] }, push: { tags: ["v*"] } }
jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: helm lint charts/canvas-lms --set canvas.existingSecret=ci
      - run: curl -fsSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | sudo tar xz -C /usr/local/bin kubeconform
      - run: helm template ci charts/canvas-lms -f charts/canvas-lms/ci/kind-values.yaml | kubeconform -strict -ignore-missing-schemas -summary
      - uses: helm/kind-action@v1
      - run: ./scripts/ci-install.sh   # make secrets, helm install, wait for web, curl /health_check
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: lint-test
    runs-on: ubuntu-latest
    permissions: { packages: write, id-token: write }
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: helm package charts/canvas-lms -d dist
      - run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin
      - run: helm push dist/*.tgz oci://ghcr.io/${{ github.repository_owner }}/charts
      - uses: sigstore/cosign-installer@v3
      - run: cosign sign --yes ghcr.io/${{ github.repository_owner }}/charts/canvas-lms:${GITHUB_REF_NAME#v}
