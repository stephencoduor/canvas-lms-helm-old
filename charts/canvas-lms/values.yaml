image:
  repository: ulevitsky/canvas-lms
  tag: ""                 # defaults to .Chart.AppVersion
  digest: ""              # prod: sha256:...
  pullPolicy: IfNotPresent

canvas:
  domain: canvas.local
  scheme: https
  ltiIssuer: ""           # defaults to scheme://domain
  accountName: Demo University
  adminEmail: admin@canvas.local
  # Secret with keys: ENCRYPTION_KEY, DB_PASSWORD, REDIS_PASSWORD, CANVAS_LMS_ADMIN_PASSWORD (+ SMTP_PASSWORD, S3_SECRET optional)
  existingSecret: canvas-secrets
  # Secret with keys jwk-past.json, jwk-present.json, jwk-future.json (private RSA JWKs). Empty = no LTI 1.3 signing.
  ltiKeysSecret: ""
  extraConfigFiles: {}    # filename -> content (rendered with tpl); "__" in a key becomes "/"

podSecurityContext: { runAsUser: 9999, runAsGroup: 9999, fsGroup: 9999, seccompProfile: { type: RuntimeDefault } }
# jobs/migrate run fully restricted. The Passenger web image starts nginx through sudo, so web needs
# privilege escalation until you switch to a Puma or non-root nginx image (see the improvement plan, P0-8).
restrictedSecurityContext: { runAsNonRoot: true, allowPrivilegeEscalation: false, capabilities: { drop: [ALL] } }
webSecurityContext: { allowPrivilegeEscalation: true, capabilities: { drop: [ALL], add: [SETUID, SETGID, NET_BIND_SERVICE, CHOWN, DAC_OVERRIDE, FOWNER, AUDIT_WRITE] } }

web:
  replicas: 2
  resources: { requests: { cpu: 250m, memory: 1Gi }, limits: { memory: 3Gi } }
  hpa: { enabled: false, min: 2, max: 6, cpu: 70 }
  pdb: { enabled: true, minAvailable: 1 }
  terminationGracePeriodSeconds: 60

jobs:
  replicas: 1
  resources: { requests: { cpu: 250m, memory: 1Gi }, limits: { memory: 3Gi } }
  pdb: { enabled: true, minAvailable: 1 }
  terminationGracePeriodSeconds: 300
  keda: { enabled: false, min: 1, max: 6, jobsPerReplica: 200 }

migrate:
  enabled: true
  timeoutSeconds: 3600
  resources: { requests: { cpu: 250m, memory: 1Gi }, limits: { memory: 3Gi } }

database:
  host: ""                # empty + postgresql.enabled → in-chart dev Postgres
  port: 5432
  name: canvas_production
  user: canvas

redis:
  url: ""                 # empty + redisDev.enabled → in-chart dev Redis

postgresql: { enabled: true, image: "postgres:14", storage: 8Gi }
redisDev: { enabled: true, image: "redis:7.4-alpine" }

storage:
  mode: pvc               # pvc | s3
  pvc: { size: 5Gi, storageClass: "", accessMode: ReadWriteOnce }
  s3: { bucket: "", region: us-east-1, endpoint: "", accessKeyId: "" }

ingress:
  enabled: false
  className: nginx
  annotations: {}
  tls: []

service: { type: ClusterIP, port: 80, nodePort: null }

networkPolicy:
  enabled: true
  allowFromNamespaces: []   # namespaces that may reach Postgres/Redis directly (e.g. [observability, keda])

monitoring:
  serviceMonitor: false
  prometheusRules: false

topologySpread: true
