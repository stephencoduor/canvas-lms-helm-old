apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "canvas.fullname" . }}-web
  labels: {{- include "canvas.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  {{- if not .Values.web.hpa.enabled }}
  replicas: {{ .Values.web.replicas }}
  {{- end }}
  strategy: { type: RollingUpdate, rollingUpdate: { maxUnavailable: 0, maxSurge: 1 } }
  selector:
    matchLabels: {{- include "canvas.selector" . | nindent 6 }}
      app.kubernetes.io/component: web
  template:
    metadata:
      labels: {{- include "canvas.selector" . | nindent 8 }}
        app.kubernetes.io/component: web
      annotations:
        checksum/config: {{ include "canvas.configFiles" . | sha256sum }}
    spec:
      securityContext: {{- toYaml .Values.podSecurityContext | nindent 8 }}
      terminationGracePeriodSeconds: {{ .Values.web.terminationGracePeriodSeconds }}
      {{- include "canvas.spread" (dict "root" . "component" "web") | nindent 6 }}
      initContainers: {{- include "canvas.waitForDb" . | nindent 8 }}
      containers:
        - name: web
          image: {{ include "canvas.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext: {{- toYaml .Values.webSecurityContext | nindent 12 }}
          ports: [{ name: http, containerPort: 80 }]
          env: {{- include "canvas.env" . | nindent 12 }}
          envFrom: {{- include "canvas.envFrom" . | nindent 12 }}
          volumeMounts: {{- include "canvas.mounts" . | nindent 12 }}
          startupProbe:  { httpGet: { path: /health_check, port: http }, periodSeconds: 10, failureThreshold: 60 }
          readinessProbe: { httpGet: { path: /health_check, port: http }, periodSeconds: 10, timeoutSeconds: 5 }
          livenessProbe:  { httpGet: { path: /health_check, port: http }, periodSeconds: 30, timeoutSeconds: 10, failureThreshold: 5 }
          lifecycle: { preStop: { exec: { command: ["sleep", "10"] } } }
          resources: {{- toYaml .Values.web.resources | nindent 12 }}
      volumes: {{- include "canvas.volumes" . | nindent 8 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "canvas.fullname" . }}-web
  labels: {{- include "canvas.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector: {{- include "canvas.selector" . | nindent 4 }}
    app.kubernetes.io/component: web
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      {{- if .Values.service.nodePort }}
      nodePort: {{ .Values.service.nodePort }}
      {{- end }}
